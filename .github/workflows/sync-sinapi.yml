name: Sincronizar Cadernos Técnicos SINAPI

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronização
        run: python -u scripts/sync_sinapi.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commitar e enviar alterações (se houver)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/pdfs docs/manifest.json
          git diff --staged --quiet && echo "Nada novo para commitar." || \
            git commit -m "Sincronização automática dos Cadernos Técnicos SINAPI [skip ci]"
          git push
